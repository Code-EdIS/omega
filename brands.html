<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Omega Brands</title>

<script src="https://cdn.tailwindcss.com"></script>


<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/animations.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-rXn4Jv..." crossorigin="anonymous" referrerpolicy="no-referrer">

</head>

<body class="bg-[#0f0f0f] text-white overflow-x-hidden">

<header class="fixed top-0 left-0 w-full z-50 backdrop-blur-md border-b border-white/10">
  <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">

  <!-- LOGO -->
  <a href="index.html" class="text-2xl w-24 font-semibold tracking-wide">
    <img src="./assets/OmegaLogo.png" alt="logo" class="w-auto object-contain"></img>
  </a>

  <!-- DESKTOP NAV -->
  <nav class="hidden md:flex gap-8 text-sm uppercase tracking-[0.2em]">

    <a href="./index.html"
      class="nav-link"
      data-i18n="nav.home"></a>

    <a href="./brands.html"
      class="nav-link"
      data-i18n="nav.brands"></a>

    <a href="./contact.html"
      class="nav-link"
      data-i18n="nav.contact"></a>

  </nav>

  <!-- RIGHT SIDE -->
  <div class="flex items-center gap-4">

    <!-- LANGUAGE -->
    <button id="lang-toggle"
      class="border border-white/20 px-4 py-2 text-xs uppercase hover:bg-white hover:text-black transition">
      EN
    </button>

    <!-- HAMBURGER -->
    <button id="menu-toggle"
      class="md:hidden flex flex-col gap-1.5">

      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>

    </button>

  </div>

</div>

<!-- MOBILE MENU -->
<div id="mobile-menu"
  class="fixed inset-0 bg-[#0f0f0f] z-40 flex flex-row items-center justify-around gap-10
  translate-x-full transition-transform duration-500 md:hidden">

  <a href="./index.html"
    class="mobile-link"
    data-i18n="nav.home"></a>

  <a href="./brands.html"
    class="mobile-link"
    data-i18n="nav.brands"></a>

  <a href="./contact.html"
    class="mobile-link"
    data-i18n="nav.contact"></a>

</div>
</header>

<section class="pt-40 pb-20 px-6">

  <div class="max-w-7xl mx-auto">

    <div class="mb-20 reveal">

      <p class="section-label">05 · BRANDS</p>

      <h1 class="text-5xl md:text-7xl font-semibold leading-none mb-8"
      data-i18n="brands.title"></h1>

      <p class="max-w-2xl text-gray-400 text-lg leading-relaxed"
      data-i18n="brands.description"></p>

    </div>

    <!-- GRID -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-8">

      <div class="brand-card apple">
        Apple
        <div class="icona-text">A</div>
      </div>

      <div class="brand-card samsung">
        Samsung
        <div class="icona-text">S</div>
      </div>

      <div class="brand-card microsoft">
        Microsoft
        <div class="icona-text">M</div>
      </div>

      <div class="brand-card logitech">
        Logitech
        <div class="icona-text">L</div>
      </div>

      <div class="brand-card asus">
        ASUS
        <div class="icona-text">A</div>
      </div>

      <div class="brand-card dell">
        Dell
        <div class="icona-text">D</div>
      </div>

      <div class="brand-card hp">
        HP
        <div class="icona-text">H</div>
      </div>

      <div class="brand-card sony">
        Sony
        <div class="icona-text">S</div>
      </div>

      <div class="brand-card canon">
        Canon
        <div class="icona-text">C</div>
      </div>

      <div class="brand-card dyson">
        Dyson
        <div class="icona-text">D</div>
      </div>

      <div class="brand-card lg">
        LG
        <div class="icona-text">L</div>
      </div>

      <div class="brand-card msi">
        MSI
        <div class="icona-text">M</div>
      </div>

    </div>

  </div>

</section>



<script src="./js/translations.js"></script>
<script src="./js/i18n.js"></script>
<script src="./js/animations.js"></script>
<script src="./js/main.js"></script>
<script src="./js/mobile-menu.js"></script>

</body>
</html>
